name: Publish to PyPI

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Detect package version
        id: package_version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          content = Path("SafePDF/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', content)
          if not match:
              raise SystemExit("Could not determine package version from SafePDF/__init__.py")
          print(f"version={match.group(1)}")
          PY

      - name: Check whether version already exists on PyPI
        id: pypi_check
        shell: bash
        env:
          PACKAGE_NAME: SafePDF
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.error
          import urllib.request

          package_name = os.environ["PACKAGE_NAME"]
          package_version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package_name}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("exists=false")
                  raise SystemExit(0)
              raise

          releases = payload.get("releases", {})
          print(f"exists={'true' if package_version in releases else 'false'}")
          PY

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Skip duplicate version
        if: steps.pypi_check.outputs.exists == 'true'
        run: echo "Version ${{ steps.package_version.outputs.version }} already exists on PyPI. Skipping publish."
