name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches __version__
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("SafePDF/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not determine version from SafePDF/__init__.py")
          print(match.group(1))
          PY
          )
          echo "Tag version:    $tag"
          echo "Source version: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag 'v$tag' does not match SafePDF/__init__.py __version__ '$version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable executable
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/build_windows.py --version "$env:VERSION"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $portable = (Resolve-Path "SafePDF/dist/SafePdf_v${version}_portable_win64.exe").Path
          $out = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DVersion=$version" "/DSourceExe=$portable" "/DOutputDir=$out" "SafePDF/installer/safepdf.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item $portable $out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SafePDF v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/*.exe
          fail_on_unmatched_files: true
